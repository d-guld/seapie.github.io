<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ditlev Guld - Studerer datalogi">
  <title>Ditlev Guld - Datalogi</title>
  <link rel="stylesheet" href="css/styles.css">
      <!-- Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Ditlev Lundsfryd Guld",
      "jobTitle": "Studerende",
      "url": "https://ditlevguld.dk",
      "description": "Studerer bachelor i datalogi."
    }
    </script>
    <script src="../js/current-year.js"></script>
</head>
<body>
    <div class="container" role="main">
        <!-- Desktop -->
        <div class="textContainerDesktop">
            <h1 class="titleDesktop">Ditlev Guld</h1>
            <p class="subheadingDesktop">Studerer bachelor i datalogi</p>
            <a class="socialsDesktop" href="https://github.com/d-guld" target="_blank">github: <span class="link">@d-guld</span></a>
        </div>
        <!-- Mobile -->
        <div class="textContainerMobile">
            <h1 class="titleMobile">Ditlev Guld</h1>
            <p class="subheadingMobile">Studerer bachelor i datalogi</p>
            <a class="socialsMobile" href="https://github.com/d-guld" target="_blank">github: <span class="link">@d-guld</span></a>
        </div>
        <!-- Footer -->
        <footer class="footerContainer">
            <div class="footerContentDesktop">
                <hr class="lineDesktop">
                <p class="footerTextDesktop">© <span id="current-year-desktop"></span> · email: mail [@] ditlevguld [.] dk</p>
            </div>
            <div class="footerContentMobile">
                <hr class="lineMobile">
                <div class="footerTextMobile">
                    <p>email: mail [@] ditlevguld [.] dk</p>
                    <p">© <span id="current-year-mobile"></span></p>
                </div> 
            </div>
        </footer>
    </div>
    <script>
      // Set current year in both footers
      document.addEventListener("DOMContentLoaded", function() {
          var yearDesktop = document.getElementById("current-year-desktop");
          var yearMobile = document.getElementById("current-year-mobile");
          var year = new Date().getFullYear();
          if (yearDesktop) yearDesktop.textContent = year;
          if (yearMobile) yearMobile.textContent = year;
      });
  </script>
</body>
